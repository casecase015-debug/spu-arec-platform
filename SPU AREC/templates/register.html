<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>สมัครสมาชิก - SPU AREC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="margin-top: 60_px; max-width: 500_px;">
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="card p-4 shadow-sm border-0 rounded-4 bg-white">
        <h3 class="text-center fw-bold mb-4" style="color: #0A1E4F;">ลงทะเบียนสมาชิกใหม่</h3>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">ชื่อ-นามสกุลจริง</label>
                <input type="text" name="name" class="form-control" required placeholder="นายกิตติภัทร ชินสาร">
            </div>
            <div class="mb-3">
                <label class="form-label">สัญญาณเรียกขาน (Callsign)</label>
                <input type="text" name="callsign" class="form-control" required placeholder="E25ABC" style="text-transform: uppercase;">
            </div>
            <div class="mb-3">
                <label class="form-label">กำหนดรหัสผ่านเข้าใช้ระบบ</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label">ประเภทสมาชิก</label>
                <select name="member_type" class="form-select">
                    <option value="นักศึกษา (สมาชิกทั่วไป)">นักศึกษา (สมาชิกทั่วไป)</option>
                    <option value="อาจารย์ / บุคลากร">อาจารย์ / บุคลากร</option>
                    <option value="บุคคลภายนอกเครือข่าย">บุคคลภายนอกเครือข่าย</option>
                </select>
            </div>
            <button type="submit" class="btn text-white w-100 py-2.5 rounded-3" style="background-color: #E21C7A;">ส่งข้อมูลลงทะเบียนไปยังระบบ</button>
        </form>
    </div>
    <div class="text-center mt-3">
        <a href="/login" class="text-muted text-decoration-none">มีบัญชีอยู่แล้ว? เข้าสู่ระบบ</a>
    </div>
</div>
</body>
</html>
