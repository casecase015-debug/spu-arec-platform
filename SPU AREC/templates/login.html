<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เข้าสู่ระบบ - SPU AREC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<div class="container d-flex flex-column align-items-center" style="margin-top: 100_px; max-width: 450_px;">
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} w-100">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="card p-4 w-100 shadow-sm border-0 rounded-4 bg-white">
        <h3 class="text-center fw-bold mb-4" style="color: #0A1E4F;">เข้าสู่ระบบ Dashboard</h3>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">สัญญาณเรียกขาน (Callsign)</label>
                <input type="text" name="callsign" class="form-control form-control-lg" required style="text-transform: uppercase;">
            </div>
            <div class="mb-4">
                <label class="form-label">รหัสผ่าน</label>
                <input type="password" name="password" class="form-control form-control-lg" required>
            </div>
            <button type="submit" class="btn text-white w-100 py-2.5 mb-3 rounded-3" style="background-color: #0A1E4F;">เข้าสู่ระบบ</button>
            
            <div class="d-flex justify-content-between text-sm">
                <a href="/forgot-password" class="text-muted text-decoration-none">ลืมรหัสผ่าน?</a>
                <a href="/register" class="text-primary text-decoration-none">สมัครสมาชิกที่นี่</a>
            </div>
        </form>
    </div>
    <a href="/" class="text-muted mt-4 text-decoration-none"><i class="fa-solid fa-arrow-left"></i> กลับหน้าค้นหาประวัติ</a>
</div>
</body>
</html>
