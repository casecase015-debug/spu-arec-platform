{% extends 'base.html' %}

{% block content %}
<div class="page-title mb-4">
    <h3 class="fw-bold"><i class="fa-solid fa-walkie-talkie text-warning me-2"></i>บันทึกการติดต่อ (QSO Log)</h3>
    <p class="text-muted">ระบบบันทึกประวัติการติดต่อสื่อสารทางวิทยุ (เวลา TH/UTC อัตโนมัติ)</p>
</div>

<div class="content-card mb-4 border-top border-warning border-4">
    <h5 class="fw-bold mb-4">เพิ่มบันทึกใหม่ (New Entry)</h5>
    <form action="/qso" method="POST">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label fw-bold small text-muted">สถานีปลายทาง</label>
                <input type="text" name="target_station" class="form-control text-uppercase fw-bold" placeholder="เช่น HS1AB" required>
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold small text-muted">ความถี่</label>
                <input type="text" name="frequency" class="form-control" placeholder="145.000" required>
            </div>
            <div class="col-md-2">
                <label class="form-label fw-bold small text-muted">โหมด</label>
                <select name="mode" class="form-select" required>
                    <option value="FM">FM</option>
                    <option value="SSB">SSB</option>
                    <option value="Digital">Digital</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label fw-bold small text-muted">RS/RST</label>
                <input type="text" name="signal_report" class="form-control" value="59" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-warning w-100 fw-bold text-dark"><i class="fa-solid fa-plus me-1"></i> บันทึก</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
