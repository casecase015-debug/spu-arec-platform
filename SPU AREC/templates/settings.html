{% extends 'base.html' %}

{% block content %}
<div class="page-title mb-4">
    <h3 class="fw-bold"><i class="fa-solid fa-gear text-secondary me-2"></i>ตั้งค่าบัญชีผู้ใช้</h3>
    <p class="text-muted">ดูข้อมูลส่วนตัวและจัดการการตั้งค่าบัญชีของคุณ</p>
</div>

<div class="row g-4">
    <div class="col-lg-6">
        <div class="content-card border-top border-secondary border-4">
            <h5 class="fw-bold mb-4">ข้อมูลส่วนตัว (Profile)</h5>
            <form>
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold small">ชื่อ-นามสกุล</label>
                    <input type="text" class="form-control bg-light" value="{{ name }}" readonly>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted fw-bold small">สัญญาณเรียกขาน (Callsign)</label>
                    <input type="text" class="form-control fw-bold text-primary bg-light" value="{{ user }}" readonly>
                </div>
                
                <div class="alert alert-warning border-0 mb-0 shadow-sm">
                    <i class="fa-solid fa-circle-info me-2"></i> <strong>หมายเหตุ:</strong> หากต้องการแก้ไขข้อมูลชื่อหรือสัญญาณเรียกขาน กรุณาติดต่อผู้ดูแลระบบ (Admin)
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
